<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>AP Scanner 2X</title>


<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}


body {

  background: #0b0f14;

  color: white;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  min-height: 100vh;
}


.app {

  max-width: 600px;

  margin: auto;

  min-height: 100vh;
}


/* HEADER */

.header {

  padding: 18px;

  display: flex;

  justify-content: space-between;

  align-items: center;
}


.title {

  font-size: 22px;

  font-weight: 800;
}


.subtitle {

  margin-top: 4px;

  font-size: 12px;

  color: #8c98a8;
}


.online {

  width: 10px;

  height: 10px;

  border-radius: 50%;

  background: #20d86a;

  box-shadow:
    0 0 12px
    rgba(32,216,106,.8);
}


/* STEP */

.step {

  margin:
    0 18px
    12px;

  padding:
    14px;

  background:
    #131922;

  border:
    1px solid
    #202a37;

  border-radius:
    14px;
}


.step-title {

  font-size:
    13px;

  font-weight:
    800;

  color:
    #20d86a;
}


.step-description {

  margin-top:
    5px;

  font-size:
    12px;

  color:
    #8c98a8;
}


/* CAMERA */

.camera-wrapper {

  position:
    relative;

  width:
    100%;

  height:
    60vh;

  min-height:
    400px;

  background:
    #000;

  overflow:
    hidden;
}


#video {

  width:
    100%;

  height:
    100%;

  object-fit:
    cover;
}


/* FRAME */

.scan-frame {

  position:
    absolute;

  left:
    3%;

  right:
    3%;

  top:
    12%;

  height:
    76%;

  border:
    2px solid
    #20d86a;

  border-radius:
    18px;

  box-shadow:
    0 0 0 9999px
    rgba(0,0,0,.25);
}


.scan-label {

  position:
    absolute;

  top:
    -34px;

  left:
    50%;

  transform:
    translateX(-50%);

  white-space:
    nowrap;

  background:
    rgba(0,0,0,.8);

  color:
    #20d86a;

  padding:
    7px 12px;

  border-radius:
    20px;

  font-size:
    11px;

  font-weight:
    800;
}


/* SCAN LINE */

.scan-line {

  position:
    absolute;

  left:
    0;

  right:
    0;

  height:
    2px;

  background:
    #20d86a;

  box-shadow:
    0 0 10px
    rgba(32,216,106,.8);

  animation:
    scanMove 2s
    infinite
    ease-in-out;
}


@keyframes scanMove {

  0% {
    top: 5%;
  }

  50% {
    top: 95%;
  }

  100% {
    top: 5%;
  }

}


/* BUTTON */

.button-area {

  padding:
    15px 18px 8px;
}


#scanButton {

  width:
    100%;

  border:
    none;

  border-radius:
    15px;

  padding:
    17px;

  font-size:
    17px;

  font-weight:
    800;

  background:
    #20d86a;

  color:
    #06100a;

  cursor:
    pointer;
}


#scanButton:disabled {

  opacity:
    .5;
}


/* RESET */

#resetButton {

  width:
    100%;

  border:
    1px solid
    #303b49;

  background:
    #151b24;

  color:
    white;

  border-radius:
    12px;

  padding:
    13px;

  margin-top:
    8px;

  display:
    none;
}


/* RESULT */

.result-card {

  margin:
    10px 18px;

  padding:
    16px;

  background:
    #131922;

  border:
    1px solid
    #202a37;

  border-radius:
    15px;
}


.result-label {

  color:
    #7f8a99;

  font-size:
    10px;

  text-transform:
    uppercase;

  margin-bottom:
    5px;
}


.result-number {

  font-size:
    24px;

  font-weight:
    800;

  word-break:
    break-all;
}


.vendor {

  margin-top:
    14px;

  padding-top:
    14px;

  border-top:
    1px solid
    #202a37;
}


.vendor-name {

  color:
    #20d86a;

  font-size:
    16px;

  font-weight:
    800;
}


.status {

  margin-top:
    12px;

  font-size:
    13px;

  color:
    #8995a5;
}


.success {

  color:
    #20d86a !important;
}


.error {

  color:
    #ff6d6d !important;
}


.warning {

  color:
    #ffc857 !important;
}


/* LOADING */

.loading {

  display:
    none;

  justify-content:
    center;

  align-items:
    center;

  gap:
    8px;

  padding:
    10px;

  color:
    #20d86a;

  font-size:
    13px;
}


.spinner {

  width:
    16px;

  height:
    16px;

  border:
    2px solid
    #303a48;

  border-top-color:
    #20d86a;

  border-radius:
    50%;

  animation:
    spin .7s
    linear
    infinite;
}


@keyframes spin {

  to {
    transform:
      rotate(360deg);
  }

}


/* STATS */

.stats {

  display:
    grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:
    8px;

  padding:
    8px 18px 20px;
}


.stat {

  background:
    #131922;

  border:
    1px solid
    #202a37;

  border-radius:
    12px;

  text-align:
    center;

  padding:
    12px 5px;
}


.stat-value {

  font-size:
    20px;

  font-weight:
    800;
}


.stat-label {

  margin-top:
    4px;

  font-size:
    9px;

  color:
    #7d8998;
}

</style>

</head>


<body>


<div class="app">


  <!-- HEADER -->

  <div class="header">

    <div>

      <div class="title">
        AP Scanner
      </div>

      <div class="subtitle">
        2x Scan — Nomor & Vendor
      </div>

    </div>

    <div class="online"></div>

  </div>


  <!-- STEP -->

  <div class="step">

    <div
      id="stepTitle"
      class="step-title"
    >
      SCAN 1 — NOMOR DOKUMEN
    </div>

    <div
      id="stepDescription"
      class="step-description"
    >
      Arahkan kamera ke nomor AP / nomor dokumen
    </div>

  </div>


  <!-- CAMERA -->

  <div class="camera-wrapper">

    <video
      id="video"
      autoplay
      playsinline
      muted
    ></video>


    <div class="scan-frame">

      <div
        id="scanLabel"
        class="scan-label"
      >
        ARAHKAN NOMOR KE SINI
      </div>

      <div class="scan-line"></div>

    </div>

  </div>


  <!-- BUTTON -->

  <div class="button-area">

    <button id="scanButton">
      📷 SCAN NOMOR
    </button>

    <button id="resetButton">
      🔄 SCAN DOKUMEN BARU
    </button>

  </div>


  <!-- LOADING -->

  <div
    id="loading"
    class="loading"
  >

    <div class="spinner"></div>

    <span>
      Membaca dokumen...
    </span>

  </div>


  <!-- RESULT -->

  <div class="result-card">

    <div class="result-label">
      Nomor Dokumen
    </div>

    <div
      id="hasil"
      class="result-number"
    >
      -
    </div>


    <div class="vendor">

      <div class="result-label">
        Vendor
      </div>

      <div
        id="vendor"
        class="vendor-name"
      >
        -
      </div>

    </div>


    <div
      id="status"
      class="status"
    >
      Siap melakukan scan
    </div>

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">

      <div
        id="scanned"
        class="stat-value"
      >
        0
      </div>

      <div class="stat-label">
        SCANNED
      </div>

    </div>


    <div class="stat">

      <div
        id="berhasil"
        class="stat-value"
      >
        0
      </div>

      <div class="stat-label">
        BERHASIL
      </div>

    </div>


    <div class="stat">

      <div
        id="duplikat"
        class="stat-value"
      >
        0
      </div>

      <div class="stat-label">
        DUPLIKAT
      </div>

    </div>

  </div>


</div>


<script src="script.js"></script>

</body>

</html>
