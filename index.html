<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AP Scanner</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#0f172a;
color:white;

}

header{

background:#2563eb;
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;

}

video{

width:100%;
height:65vh;
background:black;
object-fit:cover;

}

.container{

padding:20px;

}

button{

width:100%;
padding:18px;
font-size:22px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
cursor:pointer;

}

button:disabled{

opacity:.6;

}

.card{

margin-top:20px;
background:#1e293b;
padding:20px;
border-radius:10px;

}

.label{

font-size:14px;
color:#94a3b8;

}

#hasil{

margin-top:10px;
font-size:32px;
font-weight:bold;
color:#22c55e;
word-break:break-all;

}

#status{

margin-top:15px;
font-size:16px;
color:#facc15;

}

.loading{

display:none;
margin-top:20px;
text-align:center;

}

.spinner{

width:45px;
height:45px;
border:5px solid #334155;
border-top:5px solid #3b82f6;
border-radius:50%;
margin:auto;
animation:spin 1s linear infinite;

}

@keyframes spin{

100%{

transform:rotate(360deg);

}

}

footer{

margin-top:25px;
text-align:center;
font-size:13px;
color:#94a3b8;

}

</style>

</head>

<body>

<header>

📷 AP Scanner

</header>

<video
id="video"
autoplay
playsinline
muted>
</video>

<div class="container">

<button
id="scanBtn"
onclick="scan()">

📷 SCAN DOKUMEN

</button>

<div class="card">

<div class="label">

Nomor AP

</div>

<div id="hasil">

Belum Scan

</div>

<div id="status">

Memulai kamera...

</div>

<div
class="loading"
id="loading">

<div class="spinner"></div>

<div
style="margin-top:10px">

Sedang memproses OCR...

</div>

</div>

</div>

<footer>

AP Scanner Version 1.0

</footer>

<canvas
id="canvas"
style="display:none">
</canvas>

<script>

const WEBAPP_URL =
"https://script.google.com/macros/s/AKfycbzqA2rJ8mwF4bQcgwzNgtfgM8NapRRQD5yiiA37YtVwqbqDsMXmQCacAOsb6q2Q0RsNkg/exec";

const video =
document.getElementById("video");

const hasil =
document.getElementById("hasil");

const statusText =
document.getElementById("status");

const loading =
document.getElementById("loading");

const scanBtn =
document.getElementById("scanBtn");

window.onload = function(){

    startCamera();

};

async function startCamera(){

    if(!navigator.mediaDevices){

        status("Browser tidak mendukung kamera");

        return;

    }

    try{

        const stream =
        await navigator.mediaDevices.getUserMedia({

            video:{

                facingMode:{
                    ideal:"environment"
                },

                width:{
                    ideal:1920
                },

                height:{
                    ideal:1080
                }

            },

            audio:false

        });

        video.srcObject = stream;

        await video.play();

        status("✅ Kamera Aktif");

    }catch(err){

        console.log(err);

        alert(err.name+"\n"+err.message);

        status("❌ Gagal membuka kamera");

    }

}

function status(text){

    statusText.innerHTML=text;

}

function showLoading(){

    loading.style.display="block";

}

function hideLoading(){

    loading.style.display="none";

}

async function scan(){

    scanBtn.disabled=true;

    showLoading();

    status("📷 Mengambil gambar...");

    const canvas=
    document.getElementById("canvas");

    canvas.width=video.videoWidth;

    canvas.height=video.videoHeight;

    const ctx=
    canvas.getContext("2d");

    ctx.drawImage(

        video,

        0,

        0,

        canvas.width,

        canvas.height

    );

    const image=
    canvas
    .toDataURL("image/jpeg",0.9)
    .replace(/^data:image\/jpeg;base64,/,"");

    status("☁ Mengirim ke server...");

    try{

        const response=
        await fetch(

            WEBAPP_URL,

            {

                method:"POST",

                headers:{

                    "Content-Type":"application/json"

                },

                body:JSON.stringify({

                    image:image

                })

            }

        );

        const json=
        await response.json();

        console.log(json);
             if(json.success){

            hasil.innerHTML = json.nomor;

            status("✅ " + json.message);

            playBeep();

            vibrate();

        }else{

            hasil.innerHTML = "-";

            status("❌ " + json.message);

        }

    }catch(err){

        console.error(err);

        hasil.innerHTML="-";

        status("❌ Gagal terhubung ke Apps Script");

    }

    hideLoading();

    scanBtn.disabled=false;

}

function playBeep(){

    try{

        const audio = new Audio(
            "https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
        );

        audio.volume = 1;

        audio.play();

    }catch(e){

        console.log(e);

    }

}

function vibrate(){

    if(navigator.vibrate){

        navigator.vibrate(200);

    }

}

</script>

</body>

</html>
