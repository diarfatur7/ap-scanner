<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#07111f"
>

<title>
  AP Scanner
</title>


<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}


body {

  min-height: 100vh;

  background:
    radial-gradient(
      circle at top left,
      #16304d,
      transparent 40%
    ),
    radial-gradient(
      circle at bottom right,
      #0c2741,
      transparent 40%
    ),
    #050b13;

  color: white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  padding:
    env(safe-area-inset-top)
    14px
    env(safe-area-inset-bottom)
    14px;

}


.app {

  width: 100%;
  max-width: 650px;

  margin: auto;

}


/* ==================================================
   HEADER
================================================== */

.header {

  padding:
    20px 4px 14px;

  display: flex;

  justify-content:
    space-between;

  align-items: center;

}


.brand-title {

  font-size: 25px;

  font-weight: 800;

  letter-spacing: -0.5px;

}


.brand-subtitle {

  color: #8ea3b8;

  font-size: 12px;

  margin-top: 3px;

}


.online {

  display: flex;

  align-items: center;

  gap: 6px;

  padding:
    7px 10px;

  border-radius: 20px;

  background:
    rgba(34,197,94,.10);

  border:
    1px solid
    rgba(34,197,94,.20);

  color: #65e58c;

  font-size: 11px;

  font-weight: 700;

}


.online-dot {

  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #32e875;

  box-shadow:
    0 0 10px
    rgba(50,232,117,.8);

}


/* ==================================================
   STEP
================================================== */

.steps {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 7px;

  margin-bottom: 12px;

}


.step {

  padding: 10px 7px;

  text-align: center;

  border-radius: 12px;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid
    rgba(255,255,255,.07);

  color: #64788e;

  font-size: 10px;

  font-weight: 700;

}


.step.active {

  color: white;

  background:
    rgba(48,205,112,.10);

  border-color:
    rgba(48,205,112,.35);

}


.step.done {

  color: #66e58d;

}


/* ==================================================
   SCANNER
================================================== */

.scanner-card {

  position: relative;

  width: 100%;

  aspect-ratio: 3 / 4;

  overflow: hidden;

  border-radius: 24px;

  background: #000;

  border:
    1px solid
    rgba(255,255,255,.10);

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.45);

}


#video {

  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

}


/* ==================================================
   OVERLAY
================================================== */

.camera-overlay {

  position: absolute;

  inset: 0;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.38),
      transparent 25%,
      transparent 70%,
      rgba(0,0,0,.45)
    );

  pointer-events: none;

}


/* ==================================================
   LABEL
================================================== */

.scan-label {

  position: absolute;

  top: 30%;

  left: 50%;

  transform:
    translateX(-50%);

  white-space: nowrap;

  padding:
    7px 12px;

  border-radius: 20px;

  background:
    rgba(0,0,0,.65);

  backdrop-filter:
    blur(8px);

  color: white;

  font-size: 10px;

  font-weight: 800;

  letter-spacing: .5px;

}


/* ==================================================
   GREEN FRAME
================================================== */

.scan-frame {

  position: absolute;

  left: 17%;
  right: 17%;

  top: 38%;

  height: 18%;

  border:
    2px solid
    #36ef80;

  border-radius: 10px;

  box-shadow:
    0 0 15px
    rgba(54,239,128,.30),
    inset 0 0 15px
    rgba(54,239,128,.08);

}


/* corner */

.scan-frame::before,
.scan-frame::after {

  content: "";

  position: absolute;

  width: 18px;
  height: 18px;

  border-color: #66ff9d;

  border-style: solid;

}


.scan-frame::before {

  top: -2px;
  left: -2px;

  border-width:
    3px 0 0 3px;

}


.scan-frame::after {

  right: -2px;
  bottom: -2px;

  border-width:
    0 3px 3px 0;

}


/* ==================================================
   RESULT
================================================== */

.result-card {

  margin-top: 12px;

  padding: 15px;

  border-radius: 18px;

  background:
    rgba(255,255,255,.055);

  border:
    1px solid
    rgba(255,255,255,.08);

  backdrop-filter:
    blur(18px);

}


.result-row {

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  gap: 12px;

  padding: 8px 0;

}


.result-row + .result-row {

  border-top:
    1px solid
    rgba(255,255,255,.06);

}


.result-label {

  color: #8297aa;

  font-size: 11px;

}


.result-value {

  max-width: 70%;

  text-align: right;

  color: white;

  font-size: 13px;

  font-weight: 700;

  word-break: break-word;

}


/* ==================================================
   BUTTON
================================================== */

button {

  width: 100%;

  border: 0;

  border-radius: 15px;

  padding: 15px;

  margin-top: 12px;

  background:
    linear-gradient(
      135deg,
      #29d66e,
      #18b95a
    );

  color: #031109;

  font-size: 14px;

  font-weight: 800;

  cursor: pointer;

  box-shadow:
    0 10px 25px
    rgba(29,214,105,.18);

}


button:active {

  transform:
    scale(.98);

}


.reset {

  background:
    rgba(255,255,255,.07);

  color: white;

  border:
    1px solid
    rgba(255,255,255,.10);

  box-shadow: none;

}


/* ==================================================
   STATS
================================================== */

.stats {

  display: grid;

  grid-template-columns:
    repeat(3,1fr);

  gap: 8px;

  margin-top: 12px;

}


.stat {

  padding: 12px 7px;

  text-align: center;

  border-radius: 14px;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid
    rgba(255,255,255,.06);

}


.stat-number {

  font-size: 19px;

  font-weight: 800;

}


.stat-label {

  margin-top: 3px;

  color: #71869b;

  font-size: 9px;

  font-weight: 700;

}


/* ==================================================
   LOADING
================================================== */

#loading {

  position: fixed;

  inset: 0;

  z-index: 1000;

  display: none;

  align-items: center;

  justify-content: center;

  background:
    rgba(0,0,0,.70);

  backdrop-filter:
    blur(8px);

}


.loading-box {

  width: 180px;

  padding: 22px;

  text-align: center;

  border-radius: 18px;

  background:
    rgba(16,28,42,.95);

  border:
    1px solid
    rgba(255,255,255,.10);

}


.spinner {

  width: 32px;
  height: 32px;

  margin:
    0 auto 12px;

  border:
    3px solid
    rgba(255,255,255,.15);

  border-top-color:
    #38e979;

  border-radius: 50%;

  animation:
    spin .7s linear infinite;

}


.loading-text {

  color: #d8e2eb;

  font-size: 12px;

  font-weight: 700;

}


@keyframes spin {

  to {
    transform:
      rotate(360deg);
  }

}


.footer {

  padding:
    18px 0 10px;

  text-align: center;

  color: #52677c;

  font-size: 9px;

}


</style>

</head>


<body>


<div class="app">


  <!-- HEADER -->

  <div class="header">

    <div>

      <div class="brand-title">
        AP Scanner
      </div>

      <div class="brand-subtitle">
        Filling Document System
      </div>

    </div>


    <div class="online">

      <span class="online-dot"></span>

      ONLINE

    </div>

  </div>


  <!-- STEPS -->

  <div class="steps">

    <div
      class="step active"
      id="step1"
    >
      01<br>
      NOMOR AP
    </div>

    <div
      class="step"
      id="step2"
    >
      02<br>
      VENDOR
    </div>

    <div
      class="step"
      id="step3"
    >
      03<br>
      SELESAI
    </div>

  </div>


  <!-- SCANNER -->

  <div class="scanner-card">

    <video
      id="video"
      autoplay
      muted
      playsinline
    ></video>


    <div
      class="camera-overlay"
    ></div>


    <div
      class="scan-label"
      id="scanLabel"
    >
      ARAHKAN NOMOR AP KE SINI
    </div>


    <div
      class="scan-frame"
      id="scanFrame"
    ></div>

  </div>


  <!-- RESULT -->

  <div class="result-card">


    <div class="result-row">

      <span class="result-label">
        NOMOR DOKUMEN
      </span>

      <span
        class="result-value"
        id="hasil"
      >
        -
      </span>

    </div>


    <div class="result-row">

      <span class="result-label">
        VENDOR
      </span>

      <span
        class="result-value"
        id="vendor"
      >
        -
      </span>

    </div>


    <div class="result-row">

      <span class="result-label">
        STATUS
      </span>

      <span
        class="result-value"
        id="status"
      >
        Siap scan
      </span>

    </div>


  </div>


  <!-- BUTTON -->

  <button
    id="scanButton"
  >
    📷 SCAN NOMOR AP
  </button>


  <button
    id="resetButton"
    class="reset"
  >
    ↻ RESET
  </button>


  <!-- STATS -->

  <div class="stats">


    <div class="stat">

      <div
        class="stat-number"
        id="scanned"
      >
        0
      </div>

      <div class="stat-label">
        SCANNED
      </div>

    </div>


    <div class="stat">

      <div
        class="stat-number"
        id="berhasil"
      >
        0
      </div>

      <div class="stat-label">
        BERHASIL
      </div>

    </div>


    <div class="stat">

      <div
        class="stat-number"
        id="duplicate"
      >
        0
      </div>

      <div class="stat-label">
        DUPLICATE
      </div>

    </div>


  </div>


  <div class="footer">
    AP Scanner • Filling Document System
  </div>


</div>


<!-- LOADING -->

<div id="loading">

  <div class="loading-box">

    <div class="spinner"></div>

    <div class="loading-text">
      Memproses...
    </div>

  </div>

</div>


<!-- SCRIPT -->

<script src="script.js?v=7"></script>


</body>

</html>
