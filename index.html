<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AP Scanner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 16px;
    }

    h1 {
      text-align: center;
      margin: 10px 0 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    .scanner {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      overflow: hidden;
      border-radius: 16px;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    .scan-frame {
      position: absolute;
      left: 7%;
      right: 7%;
      top: 36%;
      height: 28%;
      border: 3px solid #00ff66;
      border-radius: 8px;
      pointer-events: none;
      box-shadow:
        0 0 0 9999px rgba(0,0,0,.25);
    }

    .scan-label {
      position: absolute;
      top: calc(36% - 30px);
      left: 0;
      width: 100%;
      text-align: center;
      color: white;
      font-weight: bold;
      text-shadow: 0 1px 4px #000;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #startCamera {
      background: #111;
      color: white;
    }

    #scanNumber {
      background: #0066ff;
      color: white;
    }

    #scanVendor {
      background: #444;
      color: white;
    }

    #saveButton {
      background: #0b8f45;
      color: white;
    }

    button:disabled {
      opacity: .5;
    }

    .result {
      margin-top: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 12px;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .preview-title {
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 8px;
    }

    #ocrPreview {
      display: none;
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      border: 2px solid #ddd;
      border-radius: 12px;
      background: #eee;
    }

    #rawOCR {
      margin-top: 10px;
      padding: 12px;
      background: #111;
      color: #00ff66;
      border-radius: 10px;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: monospace;
      font-size: 13px;
      min-height: 50px;
    }

    #status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #f0f0f0;
      text-align: center;
      font-weight: bold;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📷 AP Scanner</h1>

  <div class="card">

    <div class="scanner">

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>

      <div class="scan-label">
        Arahkan Nomor Dokumen ke Kotak
      </div>

      <div class="scan-frame"></div>

    </div>

    <button id="startCamera">
      📷 Buka Kamera
    </button>

    <button id="scanNumber" disabled>
      🔢 Scan Nomor Dokumen
    </button>

    <button id="scanVendor" disabled>
      🏢 Scan Vendor
    </button>

  </div>


  <div class="card">

    <div class="result">

      <label>Nomor Dokumen</label>

      <input
        id="nomorDokumen"
        type="text"
        placeholder="Nomor dokumen">

      <label>Vendor</label>

      <input
        id="vendor"
        type="text"
        placeholder="Nama vendor">

      <button id="saveButton">
        💾 Simpan
      </button>

      <div id="status">
        Siap
      </div>

    </div>

  </div>


  <!-- PREVIEW -->
  <div class="card">

    <div class="preview-title">
      🖼️ Gambar yang Dikirim ke OCR
    </div>

    <img
      id="ocrPreview"
      alt="Preview OCR">

    <div class="preview-title">
      📝 Raw Hasil OCR
    </div>

    <div id="rawOCR">
      Belum ada hasil OCR.
    </div>

  </div>

</div>


<canvas id="captureCanvas" class="hidden"></canvas>


<script src="script.js?v=11"></script>

</body>
</html>
