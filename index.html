<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AP Scanner</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            min-height: 100vh;
        }

        header {
            background: #2563eb;
            padding: 18px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }

        video {
            width: 100%;
            height: 65vh;
            background: black;
            object-fit: cover;
        }

        .container {
            padding: 20px;
        }

        button {
            width: 100%;
            padding: 18px;
            font-size: 22px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .card {
            margin-top: 20px;
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
        }

        .label {
            font-size: 14px;
            color: #94a3b8;
        }

        #hasil {
            margin-top: 10px;
            font-size: 32px;
            font-weight: bold;
            color: #22c55e;
            word-break: break-all;
        }

        #status {
            margin-top: 15px;
            font-size: 16px;
            color: #facc15;
        }

        .loading {
            display: none;
            margin-top: 20px;
            text-align: center;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 5px solid #334155;
            border-top: 5px solid #3b82f6;
            border-radius: 50%;
            margin: auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        footer {
            margin-top: 25px;
            padding-bottom: 20px;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
        }

    </style>

</head>

<body>

    <header>
        📷 AP Scanner
    </header>

    <video
        id="video"
        autoplay
        playsinline
        muted>
    </video>

    <div class="container">

        <button
            id="scanBtn"
            type="button">
            📷 SCAN DOKUMEN
        </button>

        <div class="card">

            <div class="label">
                Nomor AP
            </div>

            <div id="hasil">
                Belum Scan
            </div>

            <div id="status">
                Memulai kamera...
            </div>

            <div
                class="loading"
                id="loading">

                <div class="spinner"></div>

                <div style="margin-top:10px">
                    Sedang memproses OCR...
                </div>

            </div>

        </div>

    </div>

    <footer>
        AP Scanner Version 1.0
    </footer>

    <canvas
        id="canvas"
        style="display:none">
    </canvas>

    <!-- JavaScript scanner -->
    <script src="script.js"></script>

</body>

</html>
