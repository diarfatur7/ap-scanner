<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SCAN PV</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <main class="app">

    <!-- HEADER -->
    <header class="header">

      <div>
        <h1>SCAN PV</h1>
        <p>Payment Voucher Scanner</p>
      </div>

      <div
        id="connectionDot"
        class="connection-dot"
      ></div>

    </header>


    <!-- CAMERA -->
    <section class="camera-section">

      <video
        id="camera"
        autoplay
        playsinline
        muted
      ></video>

      <div class="camera-overlay">

        <div class="top-info">

          <span
            id="stageLabel"
            class="stage-label"
          >
            📄 FOTO PV
          </span>

          <span
            id="cameraStatus"
            class="camera-status"
          >
            Kamera
          </span>

        </div>


        <div class="focus-box">

          <span class="corner tl"></span>
          <span class="corner tr"></span>
          <span class="corner bl"></span>
          <span class="corner br"></span>

        </div>

      </div>

    </section>


    <!-- INSTRUCTION -->
    <section class="instruction">

      <h2 id="instructionTitle">
        Foto Payment Voucher
      </h2>

      <p id="instructionText">
        Arahkan kamera ke dokumen PV lalu tekan tombol kamera.
      </p>

    </section>


    <!-- CAMERA BUTTON -->
    <section
      id="cameraControls"
      class="camera-controls"
    >

      <button
        id="captureButton"
        class="capture-button"
      >
      </button>

    </section>


    <!-- PREVIEW -->
    <section
      id="previewSection"
      class="preview-section hidden"
    >

      <h2 id="previewTitle">
        Preview
      </h2>

      <img
        id="previewImage"
        class="preview-image"
        alt="Preview"
      >

      <div class="preview-actions">

        <button
          id="retakeButton"
          class="button secondary"
        >
          🔄 Ulangi
        </button>

        <button
          id="nextButton"
          class="button primary"
        >
          Lanjut
        </button>

      </div>

    </section>


    <!-- SAVE STATUS -->
    <div
      id="saveStatus"
      class="save-status hidden"
    ></div>


    <!-- OCR QUEUE -->
    <section class="queue-section">

      <div class="queue-header">

        <h2>
          ⚙️ Status OCR
        </h2>

        <span>
          otomatis
        </span>

      </div>

      <div
        id="queueList"
        class="queue-list"
      >

        <div class="empty-queue">
          Belum ada scan.
        </div>

      </div>

    </section>


  </main>


  <canvas
    id="canvas"
    hidden
  ></canvas>


  <script src="app.js"></script>

</body>
</html>
