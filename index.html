<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AP Scanner Fast</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    color:white;
}

header{
    background:#2563eb;
    padding:15px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.camera-wrap{
    position:relative;
    width:100%;
    height:58vh;
    background:#000;
    overflow:hidden;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* AREA SCAN */

.scan-frame{

    position:absolute;

    left:8%;
    right:8%;

    top:35%;

    height:30%;

    border:3px solid #22c55e;

    border-radius:12px;

    box-shadow:
        0 0 0 9999px rgba(0,0,0,.35);

}

.scan-label{

    position:absolute;

    top:-32px;

    left:50%;

    transform:translateX(-50%);

    background:#22c55e;

    color:#000;

    padding:6px 12px;

    border-radius:6px;

    font-size:13px;

    font-weight:bold;

    white-space:nowrap;

}

.container{
    padding:15px;
}

button{

    width:100%;

    padding:17px;

    font-size:20px;

    border:none;

    border-radius:10px;

    background:#2563eb;

    color:white;

    cursor:pointer;

}

button:disabled{
    opacity:.5;
}

.card{

    margin-top:15px;

    background:#1e293b;

    padding:15px;

    border-radius:10px;

}

.label{

    font-size:13px;

    color:#94a3b8;

}

#hasil{

    margin-top:7px;

    font-size:30px;

    font-weight:bold;

    color:#22c55e;

    word-break:break-all;

}

#status{

    margin-top:10px;

    font-size:15px;

    color:#facc15;

}

.stats{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:8px;

    margin-top:12px;

}

.stat{

    background:#0f172a;

    padding:12px 5px;

    text-align:center;

    border-radius:8px;

}

.stat-number{

    font-size:22px;

    font-weight:bold;

}

.stat-label{

    margin-top:4px;

    font-size:11px;

    color:#94a3b8;

}

.loading{

    display:none;

    margin-top:12px;

    text-align:center;

}

.spinner{

    width:35px;

    height:35px;

    border:4px solid #334155;

    border-top:4px solid #3b82f6;

    border-radius:50%;

    margin:auto;

    animation:spin .8s linear infinite;

}

@keyframes spin{

    100%{
        transform:rotate(360deg);
    }

}

footer{

    margin-top:15px;

    text-align:center;

    font-size:12px;

    color:#64748b;

}

</style>

</head>


<body>


<header>
📷 AP SCANNER — FAST
</header>


<div class="camera-wrap">

    <video
        id="video"
        autoplay
        playsinline
        muted>
    </video>

    <div class="scan-frame">

        <div class="scan-label">
            ARAHKAN NOMOR AP KE SINI
        </div>

    </div>

</div>


<div class="container">


<button
    id="scanBtn"
    onclick="scan()">

    📷 SCAN DOKUMEN

</button>


<div class="card">


<div class="label">
Nomor AP
</div>


<div id="hasil">
Belum Scan
</div>


<div id="status">
Memulai kamera...
</div>


<div
    class="loading"
    id="loading">

    <div class="spinner"></div>

    <div style="margin-top:8px">
        OCR sedang memproses...
    </div>

</div>


<div class="stats">


<div class="stat">

    <div
        class="stat-number"
        id="totalScan">
        0
    </div>

    <div class="stat-label">
        SCANNED
    </div>

</div>


<div class="stat">

    <div
        class="stat-number"
        id="successScan">
        0
    </div>

    <div class="stat-label">
        BERHASIL
    </div>

</div>


<div class="stat">

    <div
        class="stat-number"
        id="duplicateScan">
        0
    </div>

    <div class="stat-label">
        DUPLIKAT
    </div>

</div>


</div>


</div>


<footer>
AP Scanner Fast v2
</footer>


<canvas
    id="canvas"
    style="display:none;">
</canvas>


<script src="script.js"></script>


</body>

</html>
