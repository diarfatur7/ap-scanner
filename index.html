<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>AP Scanner Fast</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {

      background: #0b0f14;

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      min-height: 100vh;

      overflow-x: hidden;
    }


    .app {

      width: 100%;

      max-width: 600px;

      margin: auto;

      min-height: 100vh;

      display: flex;

      flex-direction: column;
    }


    /* HEADER */

    .header {

      padding: 18px 18px 12px;

      display: flex;

      align-items: center;

      justify-content: space-between;
    }


    .title {

      font-size: 22px;

      font-weight: 800;
    }


    .subtitle {

      color: #8e99a8;

      font-size: 12px;

      margin-top: 3px;
    }


    .online {

      width: 10px;

      height: 10px;

      background: #20e070;

      border-radius: 50%;

      box-shadow:
        0 0 12px
        rgba(32,224,112,.8);
    }


    /* CAMERA */

    .camera-wrapper {

      position: relative;

      width: 100%;

      height: 62vh;

      min-height: 400px;

      max-height: 680px;

      background: black;

      overflow: hidden;
    }


    #video {

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;
    }


    /* OVERLAY */

    .camera-overlay {

      position: absolute;

      inset: 0;

      pointer-events: none;
    }


    .scan-frame {

      position: absolute;

      left: 3%;

      right: 3%;

      top: 12%;

      height: 76%;

      border:
        2px solid
        #22e06f;

      border-radius: 18px;

      box-shadow:
        0 0 0 9999px
        rgba(0,0,0,.25),

        0 0 20px
        rgba(34,224,111,.25);
    }


    .scan-label {

      position: absolute;

      top: -34px;

      left: 50%;

      transform:
        translateX(-50%);

      white-space: nowrap;

      background:
        rgba(0,0,0,.75);

      color: #22e06f;

      font-size: 11px;

      font-weight: 700;

      padding:
        7px 12px;

      border-radius: 20px;
    }


    /* SCAN LINE */

    .scan-line {

      position: absolute;

      left: 0;

      right: 0;

      height: 2px;

      background: #22e06f;

      box-shadow:
        0 0 12px
        rgba(34,224,111,.9);

      animation:
        scanMove 2.2s
        infinite
        ease-in-out;
    }


    @keyframes scanMove {

      0% {
        top: 5%;
      }

      50% {
        top: 95%;
      }

      100% {
        top: 5%;
      }
    }


    /* BUTTON */

    .button-area {

      padding: 15px 18px 8px;
    }


    #scanButton {

      width: 100%;

      border: none;

      background:
        linear-gradient(
          135deg,
          #20d86a,
          #15b957
        );

      color: #06100a;

      font-size: 17px;

      font-weight: 800;

      padding: 17px;

      border-radius: 15px;

      cursor: pointer;

      box-shadow:
        0 7px 20px
        rgba(32,216,106,.18);
    }


    #scanButton:active {

      transform: scale(.98);
    }


    #scanButton:disabled {

      opacity: .5;

      cursor: not-allowed;
    }


    /* RESULT */

    .result-card {

      margin: 10px 18px;

      padding: 17px;

      background: #131922;

      border:
        1px solid
        #202a37;

      border-radius: 15px;
    }


    .result-title {

      color: #8792a2;

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: .7px;

      margin-bottom: 5px;
    }


    .result-number {

      font-size: 25px;

      font-weight: 800;

      word-break: break-all;

      color: white;
    }


    .vendor {

      margin-top: 12px;

      padding-top: 12px;

      border-top:
        1px solid
        #202a37;
    }


    .vendor-name {

      font-size: 15px;

      font-weight: 700;

      color: #20d86a;

      margin-top: 4px;
    }


    .status {

      margin-top: 10px;

      font-size: 13px;

      color: #8e99a8;

    }


    /* LOADING */

    .loading {

      display: none;

      align-items: center;

      justify-content: center;

      gap: 9px;

      padding: 10px;

      color: #20d86a;

      font-size: 13px;
    }


    .spinner {

      width: 16px;

      height: 16px;

      border:
        2px solid
        #344150;

      border-top-color:
        #20d86a;

      border-radius: 50%;

      animation:
        spin .7s linear infinite;
    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    /* STATS */

    .stats {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 8px;

      padding:
        8px 18px 20px;
    }


    .stat {

      background: #131922;

      border:
        1px solid
        #202a37;

      border-radius: 12px;

      padding: 12px 8px;

      text-align: center;
    }


    .stat-value {

      font-size: 20px;

      font-weight: 800;
    }


    .stat-label {

      color: #7d8998;

      font-size: 9px;

      margin-top: 4px;

      letter-spacing: .5px;
    }


    /* ERROR */

    .error {

      color: #ff7070 !important;
    }


    .success {

      color: #20d86a !important;
    }


    .warning {

      color: #ffc857 !important;
    }


    /* MOBILE */

    @media (max-width: 400px) {

      .camera-wrapper {

        height: 58vh;
      }


      .result-number {

        font-size: 21px;
      }


      #scanButton {

        font-size: 16px;

        padding: 15px;
      }

    }

  </style>

</head>


<body>

<div class="app">


  <!-- HEADER -->

  <div class="header">

    <div>

      <div class="title">
        AP Scanner
      </div>

      <div class="subtitle">
        Scan nomor dokumen & vendor
      </div>

    </div>


    <div
      class="online"
      title="Scanner Online"
    ></div>

  </div>


  <!-- CAMERA -->

  <div class="camera-wrapper">

    <video
      id="video"
      autoplay
      playsinline
      muted
    ></video>


    <div class="camera-overlay">

      <div class="scan-frame">

        <div class="scan-label">
          ARAHKAN DOKUMEN KE SINI
        </div>

        <div class="scan-line"></div>

      </div>

    </div>

  </div>


  <!-- BUTTON -->

  <div class="button-area">

    <button id="scanButton">
      📷 SCAN DOKUMEN
    </button>

  </div>


  <!-- LOADING -->

  <div
    id="loading"
    class="loading"
  >

    <div class="spinner"></div>

    <span>
      Membaca dokumen...
    </span>

  </div>


  <!-- RESULT -->

  <div class="result-card">

    <div class="result-title">
      Nomor Dokumen
    </div>

    <div
      id="hasil"
      class="result-number"
    >
      -
    </div>


    <div class="vendor">

      <div class="result-title">
        Vendor
      </div>

      <div
        id="vendor"
        class="vendor-name"
      >
        -
      </div>

    </div>


    <div
      id="status"
      class="status"
    >
      Siap melakukan scan
    </div>

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">

      <div
        id="scanned"
        class="stat-value"
      >
        0
      </div>

      <div class="stat-label">
        SCANNED
      </div>

    </div>


    <div class="stat">

      <div
        id="berhasil"
        class="stat-value"
      >
        0
      </div>

      <div class="stat-label">
        BERHASIL
      </div>

    </div>


    <div class="stat">

      <div
        id="duplikat"
        class="stat-value"
      >
        0
      </div>

      <div class="stat-label">
        DUPLIKAT
      </div>

    </div>

  </div>


</div>


<script src="script.js"></script>

</body>

</html>
