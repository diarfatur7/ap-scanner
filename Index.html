<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP Scanner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#111;color:#fff}
header{background:#0d6efd;padding:18px;text-align:center;font-size:28px;font-weight:bold}
video{width:100%;height:65vh;background:#000;object-fit:cover}
.container{padding:20px}
button{width:100%;padding:16px;border:none;border-radius:10px;background:#0d6efd;color:#fff;font-size:22px;cursor:pointer}
#hasil{margin-top:20px;font-size:30px;text-align:center;font-weight:bold}
#status{margin-top:10px;text-align:center;color:#00ff88}
</style>
</head>
<body>

<header>AP SCANNER</header>

<video id="video" autoplay playsinline muted></video>

<div class="container">
<button onclick="scan()">📷 SCAN</button>
<div id="hasil">Belum Scan</div>
<div id="status">Memulai kamera...</div>
</div>

<canvas id="canvas" style="display:none"></canvas>

<script>
const API_KEY="GANTI_DENGAN_API_KEY_BARU";
const video=document.getElementById("video");

window.onload=startCamera;

async function startCamera(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
        status("Browser tidak mendukung kamera");
        return;
    }
    try{
        const stream=await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:{ideal:"environment"},
                width:{ideal:1280},
                height:{ideal:720}
            },
            audio:false
        });
        video.srcObject=stream;
        await video.play();
        status("Kamera aktif");
    }catch(e){
        alert(e.name+"\n"+e.message);
        status("Gagal membuka kamera");
        console.error(e);
    }
}

function status(t){
    document.getElementById("status").innerText=t;
}

async function scan(){

    status("Mengambil gambar...");

    const canvas=document.getElementById("canvas");
    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;

    const ctx=canvas.getContext("2d");
    ctx.drawImage(video,0,0);

    const base64=canvas.toDataURL("image/jpeg").replace(/^data:image\/jpeg;base64,/,"");

    const payload={
      requests:[{
        image:{content:base64},
        features:[{type:"DOCUMENT_TEXT_DETECTION"}]
      }]
    };

    try{

        const res=await fetch(
          "https://vision.googleapis.com/v1/images:annotate?key="+API_KEY,
          {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify(payload)
          });

        const json=await res.json();

        let text="";
        if(json.responses &&
           json.responses[0] &&
           json.responses[0].fullTextAnnotation){
            text=json.responses[0].fullTextAnnotation.text;
        }

        console.log(text);

        const match=text.match(/92\d{8}/);

        if(!match){
            document.getElementById("hasil").innerText="Nomor tidak ditemukan";
            status("Scan ulang");
            return;
        }

        const nomor=match[0];
        document.getElementById("hasil").innerText=nomor;

        if(typeof google!=="undefined" && google.script){
            google.script.run
            .withSuccessHandler(function(r){
                status(r.message);
            })
            .withFailureHandler(function(e){
                status("Gagal simpan");
                console.error(e);
            })
            .saveAP(nomor);
        }else{
            status("Mode preview (google.script.run tidak tersedia)");
        }

    }catch(e){
        console.error(e);
        status("OCR gagal");
    }
}
</script>

</body>
</html>
